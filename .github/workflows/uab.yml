name: Linyaps package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Espelho do builder oficial; a variável permite trocar a origem.
      DEEPWIN_BUILDER_IMAGE: ${{ vars.DEEPWIN_BUILDER_IMAGE || 'ghcr.io/eduardodaluz/linyaps-builder@sha256:9170f635112d5068ef815d6e55d6bd3969e668151bd31a33ca48086f53fd372a' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull Linyaps builder (three bounded attempts)
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          {
            for attempt in 1 2 3; do
              echo "Pull ${attempt}/3: ${DEEPWIN_BUILDER_IMAGE}"
              if timeout --kill-after=15s 180s docker pull "$DEEPWIN_BUILDER_IMAGE"; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep 15; fi
            done
            exit 1
          } 2>&1 | tee pull.log
      - name: Build UAB in the official Linyaps builder
        shell: bash
        run: |
          set -o pipefail
          ./bin/build-uab 2>&1 | tee build.log
      - name: Report failure tail
        if: failure()
        shell: bash
        run: |
          for log in build.log pull.log; do
            [ -f "$log" ] || continue
            message="$(tail -c 4000 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error title=%s::%s\n' "$log" "$message"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepwin-uab-logs
          if-no-files-found: ignore
          path: |
            pull.log
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: deepwin-uab-amd64
          path: |
            dist/*.uab
            dist/*.sha256
